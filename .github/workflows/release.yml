name: Release Build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
jobs:
  build:
    name: Build
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Prepare Signing Material
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.MOBILETINA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          fi
      - name: Gradle Build
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          PRODUCTION_SIGNER_SHA256: ${{ secrets.MOBILETINA_PRODUCTION_SIGNER_SHA256 }}
          RELEASE_REQUESTED: ${{ github.event.inputs.release }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${HOME}/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          signer_sha="$(./gradlew -q :app:printMobileTinaReleaseCertificateSha256 | tail -n 1)"
          if ! [[ "$signer_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Release signer fingerprint is invalid" >&2
            exit 1
          fi
          if [ -f release.keystore ]; then
            normalized_production_signer="${PRODUCTION_SIGNER_SHA256,,}"
            if ! [[ "$normalized_production_signer" =~ ^[0-9a-f]{64}$ ]]; then
              echo "MOBILETINA_PRODUCTION_SIGNER_SHA256 is required for production signing" >&2
              exit 1
            fi
            if [ "$signer_sha" != "$normalized_production_signer" ]; then
              echo "Production signing certificate does not match the pinned fingerprint" >&2
              exit 1
            fi
          elif [ "$RELEASE_REQUESTED" = "y" ]; then
            echo "Publishing requires the production keystore; refusing debug-signed release" >&2
            exit 1
          fi
          ./gradlew -PMOBILETINA_EXPECTED_SIGNER_SHA256="${signer_sha}" :app:downloadAssets
          ./gradlew -PMOBILETINA_EXPECTED_SIGNER_SHA256="${signer_sha}" :app:assembleOssRelease
          mkdir -p artifacts
          universal_apk="$(find app/build/outputs/apk/oss/release -type f -name '*universal*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$universal_apk"
          cp "$universal_apk" artifacts/MobileTina-ARMv7-ARMv8-universal.apk
          apksigner="${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs artifacts/MobileTina-ARMv7-ARMv8-universal.apk
      - name: Remove Signing Material
        if: always()
        run: rm -f release.keystore
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MobileTina-ARM-Universal
          path: artifacts/MobileTina-ARMv7-ARMv8-universal.apk
  publish:
    name: Publish Release
    if: github.event.inputs.release == 'y' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: MobileTina-ARM-Universal
          path: artifacts
      - name: Publish Pre-release
        if: github.event.inputs.prerelease == 'y'
        run: |
          gh release create "$RELEASE_TAG" --notes="" --title="$RELEASE_TAG" --prerelease artifacts/MobileTina-ARMv7-ARMv8-universal.apk
      - name: Publish Release
        if: github.event.inputs.prerelease != 'y'
        run: |
          gh release create "$RELEASE_TAG" --notes="" --title="$RELEASE_TAG" artifacts/MobileTina-ARMv7-ARMv8-universal.apk
